<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba Gemini</title>

<style>

body{
font-family:Arial,sans-serif;
padding:30px;
background:#f5f5f5;
}

button{
padding:10px 20px;
cursor:pointer;
}

pre{
background:white;
padding:15px;
border:1px solid #ccc;
overflow:auto;
margin-top:20px;
white-space:pre-wrap;
}

</style>

</head>

<body>

<h1>Prueba Gemini</h1>

<button onclick="probarGemini()">
Probar API
</button>

<pre id="resultado"></pre>

<script>

const API_KEY = "AQ.Ab8RN6Kw5dmH5YUa_fxXXCMlLM0lfoeml7h4WlSvkQLgsfu4hw";

async function probarGemini(){

let resultado =
document.getElementById("resultado");

resultado.innerText = "Probando conexión con Gemini...";

try{

const response = await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[
{
parts:[
{
text:"Responde únicamente: Hola Mundo"
}
]
}
]

})

}

);

const data = await response.json();

console.log("STATUS:",response.status);
console.log("DATA:",data);

resultado.innerText =
JSON.stringify(
{
status: response.status,
respuesta: data
},
null,
2
);

}
catch(error){

console.error(error);

resultado.innerText =
"ERROR:\n\n" + error;

}

}

</script>

</body>

</html>
